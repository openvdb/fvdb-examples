[project]
name = "car-example"
version = "0.1.0"
description = "Vehicle glint scene example for the modsim toolbox"
requires-python = ">=3.12"
dependencies = [
  "modsim-toolbox",
  "numpy",
  "pandas",
  "pvlib>=0.11",
]

# `tool.uv.sources` is not inherited from a path dependency, so the index
# routing that modsim-toolbox declares has to be repeated here. Keep the two
# files in sync: fvdb-core wheels are built against one exact torch minor.
[tool.uv.sources]
modsim-toolbox = { path = "../..", editable = true }
torch = { index = "pytorch-cu130" }
fvdb-core = { index = "fvdb-release" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "fvdb-release"
url = "https://d36m13axqqhiit.cloudfront.net/simple"
explicit = true
